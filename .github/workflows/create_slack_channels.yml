name: New Customer Slack Channel Setup

on:
  workflow_dispatch:
    inputs:
      customer_name:
        description: >
          Customer slug (lowercase, hyphens only — e.g. "acme-corp", "widget-co").
          This becomes the identifier in all channel names.
        required: true
        type: string
      customer_display_name:
        description: >
          Human-readable display name for the customer (used in channel topics/descriptions).
          e.g. "Acme Corp", "Widget Co"
        required: true
        type: string
      channel_preset:
        description: Channel preset to provision
        required: true
        type: choice
        options:
          - standard          # it-support + private + hr + onboarding (default for new SMB clients)
          - full              # standard + devops + access-alerts + announcements
          - minimal           # it-support only (for trial / short-term engagements)
        default: standard

jobs:
  create-channels:
    name: Provision Slack Channels for ${{ inputs.customer_display_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ─────────────────────────────────────────────
      # Create channels, set purposes, invite Pylon
      # ─────────────────────────────────────────────
      - name: Create Slack channels
        id: create
        env:
          # A Workspace Admin's user (xoxp) token; required to create private
          # channels when the workspace restricts that to admins/owners.
          SLACK_USER_TOKEN: ${{ secrets.SLACK_USER_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          PYLON_SLACK_USER_ID: ${{ secrets.PYLON_SLACK_USER_ID }}
          CUSTOMER_NAME: ${{ inputs.customer_name }}
          CUSTOMER_DISPLAY_NAME: ${{ inputs.customer_display_name }}
          CHANNEL_PRESET: ${{ inputs.channel_preset }}
        run: python create_client_channels.py

      # ─────────────────────────────────────────────
      # Post summary to internal RCIT Slack channel
      # ─────────────────────────────────────────────
      - name: Post completion summary to RCIT
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CUSTOMER: ${{ inputs.customer_display_name }}
          SLUG: ${{ inputs.customer_name }}
          PRESET: ${{ inputs.channel_preset }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          EMOJI="✅"
          STATUS_TEXT="All channels provisioned successfully."
          if [ "$JOB_STATUS" != "success" ]; then
            EMOJI="❌"
            STATUS_TEXT="Some channels failed — check the workflow logs."
          fi

          MESSAGE="${EMOJI} *New Customer Slack Setup — ${CUSTOMER}*\n\n"
          MESSAGE+="• Slug: \`${SLUG}\`\n"
          MESSAGE+="• Preset: \`${PRESET}\`\n"
          MESSAGE+="• Status: ${STATUS_TEXT}\n"
          MESSAGE+="• <${RUN_URL}|View workflow run>\n\n"
          MESSAGE+="_Triggered by GitHub Actions_"

          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"channel\": \"#team_rcit-internal\",
              \"text\": \"${MESSAGE}\"
            }" > /dev/null
